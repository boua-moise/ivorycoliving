<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à Jour du Mot de Passe</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/header_footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/forgot.css') }}">
</head>
<body>
    <main>
        <div class="form-container">
            <h1>Réinitialiser le Mot de Passe</h1>
            <form action="/reset_password" method="post">
                <label for="new_password">Nouveau Mot de Passe :</label>
                <input type="password" id="new_password" name="new_password" placeholder="Entrez un nouveau mot de passe" required>
                
                <label for="confirm_password">Confirmer le Nouveau Mot de Passe :</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmez le nouveau mot de passe" required>
                
                <button type="submit">Mettre à Jour</button>
            </form>
        </div>
    </main>
</body>
</html>
