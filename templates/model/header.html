<header>
    <nav>
        <span class="logo"><a href="/">IvoryCoLiving</a></span>
        <div class="menu-header">
            <a href="/">Accueil</a>
            <a href="/familyhost">Host Family</a>
            <a href="/colocataires">Colocataire</a>
            <a href="/logements">Logements</a>
            <a href="/contact">Contact</a>
            {% if user %}
              {% if user.role %}
                <a href="/admin">Admin</a>
              {% endif %}
            {% endif %}
        </div>

        {% if user %}

        <div class="menu">
            <div class="menu-titre" onclick="toggleMenu()"> <strong>{{user.perso}}</strong> </div>
            <div class="menu-options" id="menuOptions">
              <div><a href="/dashboard">Tableau de bord</a></div>
              <div><a href="/dashboard">Tableau de bord</a></div>
              <div><a href="/logout">Déconnexion</a></div>
            </div>
        </div>

        {% else %}

            <div>
                <a href="/login" class="btn login">Connexion</a>
                <a href="/register" class="btn register">Inscription</a>
            </div>

        {% endif %}
    </nav>

    <script>

        function toggleMenu() {
            const menu = document.getElementById('menuOptions');
            menu.classList.toggle('open'); // Ajoute/enlève la classe "open"
        }

    </script>

</header>
